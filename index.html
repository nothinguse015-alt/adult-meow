<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0b0d">
  <meta name="description" content="Adult Meow! — gaming vibes, Roblox, YouTube and TikTok.">
  <title>Adult Meow! | About Me</title>
  <style>
    :root {
      --bg: #09090b;
      --panel: rgba(22, 22, 27, .88);
      --red: #ff303b;
      --red2: #a90f20;
      --text: #f6f6f8;
      --muted: #aaaab4;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0; min-height: 100vh; color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(ellipse at 50% -10%, rgba(255,48,59,.23), transparent 45%),
        radial-gradient(ellipse at 100% 65%, rgba(169,15,32,.12), transparent 35%),
        var(--bg);
      display: grid; place-items: center; padding: 28px 16px;
    }
    .wrap { width: min(100%, 520px); }
    .topline { display:flex; justify-content:center; align-items:center; gap:9px; margin-bottom:18px; color:#d5d5dc; font-size:.75rem; letter-spacing:.22em; text-transform:uppercase; }
    .dot { width:7px; height:7px; border-radius:50%; background:var(--red); box-shadow:0 0 12px var(--red); }
    .card {
      position:relative; overflow:hidden; padding:34px 25px 25px; border:1px solid rgba(255,255,255,.10);
      border-radius:28px; background:linear-gradient(155deg, rgba(30,30,36,.94), rgba(13,13,16,.96));
      box-shadow:0 24px 80px rgba(0,0,0,.48), 0 0 42px rgba(255,48,59,.08);
    }
    .card:before { content:""; position:absolute; height:3px; top:0; left:12%; right:12%; background:linear-gradient(90deg, transparent, var(--red), transparent); }
    .avatar {
      width:112px; height:112px; margin:0 auto 20px; display:block; object-fit:cover;
      border-radius:28px; background:#000; border:2px solid rgba(255,255,255,.88);
      box-shadow:0 0 0 7px rgba(255,48,59,.07), 0 10px 35px rgba(255,48,59,.22);
      transform:rotate(-3deg);
    }
    h1 { margin:0; text-align:center; font-size:clamp(1.8rem, 7vw, 2.45rem); letter-spacing:.06em; font-weight:900; }
    .tag { margin:10px 0 0; text-align:center; color:var(--red); font-size:.78rem; font-weight:800; letter-spacing:.2em; }
    .bio { color:var(--muted); text-align:center; line-height:1.65; margin:17px auto 25px; max-width:340px; font-size:.94rem; }
    .links { display:grid; gap:12px; }
    .link {
      display:flex; align-items:center; gap:14px; min-height:66px; padding:12px 16px; border-radius:16px;
      text-decoration:none; color:var(--text); background:rgba(255,255,255,.045);
      border:1px solid rgba(255,255,255,.09); transition:transform .18s ease, border-color .18s ease, background .18s ease;
    }
    .link:hover, .link:focus-visible { transform:translateY(-2px); border-color:rgba(255,48,59,.65); background:rgba(255,48,59,.09); outline:none; }
    .icon { width:40px; height:40px; display:grid; place-items:center; flex:0 0 40px; border-radius:12px; background:rgba(255,48,59,.13); color:#ff5861; }
    .icon svg { width:22px; height:22px; fill:currentColor; }
    .label { display:flex; flex-direction:column; gap:3px; min-width:0; }
    .label strong { font-size:.98rem; }
    .label small { color:var(--muted); font-size:.78rem; }
    .arrow { margin-left:auto; color:#777780; font-size:1.15rem; }
    .footer { margin-top:22px; text-align:center; color:#777780; font-size:.75rem; letter-spacing:.12em; }
    .footer span { color:var(--red); }
    @media (max-width:380px) { .card { padding:29px 17px 21px; } .link { padding:11px 12px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior:auto !important; transition:none !important; } }
  </style>
</head>
